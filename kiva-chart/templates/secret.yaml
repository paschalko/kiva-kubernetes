{{- $existing := lookup "v1" "Secret" .Release.Namespace "kiva-backend-secrets" }}
apiVersion: v1
kind: Secret
metadata:
  name: kiva-backend-secrets
type: Opaque
data:
  {{- if .Values.backend.jwtSecret }}
  JWT_SECRET: {{ .Values.backend.jwtSecret | b64enc | quote }}
  {{- else if $existing }}
  JWT_SECRET: {{ index $existing.data "JWT_SECRET" | quote }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
