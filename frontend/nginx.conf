server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls and uploaded images to the backend Service
    location /api/ {
        proxy_pass http://kiva-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }

    location /uploads/ {
        proxy_pass http://kiva-backend:5000;
    }

    # Used by Kubernetes readiness and liveness probes
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Single-page app: send unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
